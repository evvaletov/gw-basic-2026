name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse-dev || true

      - name: Build
        run: |
          mkdir build
          cd build
          cmake ..
          make -j$(nproc)

      - name: Harness regression tests
        run: |
          python3 tests/test_harnesses.py
          python3 tests/test_corpus.py
          python3 tests/test_tokenizer.py --sanitize
          python3 tests/test_line_numbers.py
          python3 tests/test_dos_runtime.py

      - name: Interpreter tests (audio disabled)
        env:
          PULSE_SERVER: unix:/tmp/gwbasic-ci-no-audio-server
        run: bash tests/run_tests.sh

      - name: Compiler tests
        run: bash tests/run_compiler_tests.sh

      - name: Compiler control flow, string and array regressions
        run: |
          python3 tests/test_compiler_regressions.py
          python3 tests/test_compiler_paths.py

      - name: Curated compatibility corpus
        run: bash tests/run_corpus.sh --report corpus-matrix.json

      - name: Upload compatibility matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-matrix
          path: corpus-matrix.json
          if-no-files-found: warn

      - name: Interactive terminal regressions
        run: |
          python3 -m pip install -r tests/requirements.txt
          python3 tests/test_interactive.py

      - name: Codegen safety (termination / bounded output)
        run: bash tests/run_codegen_safety.sh

      - name: Cross-language (FFI) test
        run: bash tests/run_ffi_test.sh

  vscode-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        vscode: ['1.75.1', 'stable']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Build runtime for editor integration tests
        run: |
          cmake -S . -B build
          cmake --build build -j2
      - name: Install extension build tools
        run: npm ci
        working-directory: editors/vscode
      - name: Command and language tests
        run: npm test
        working-directory: editors/vscode
      - name: Package VSIX
        run: npm run package
        working-directory: editors/vscode
      - name: Install and test packaged extension in VS Code
        env:
          VSCODE_TEST_VERSION: ${{ matrix.vscode }}
        run: xvfb-run -a npm run test:integration
        working-directory: editors/vscode
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-${{ matrix.vscode }}
          path: editors/vscode/dist/*.vsix
          if-no-files-found: error

  dos-cross-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Cache OpenWatcom V2
        id: cache-watcom
        uses: actions/cache@v4
        with:
          path: ~/openwatcom-v2
          key: openwatcom-v2-snapshot

      - name: Install OpenWatcom V2
        if: steps.cache-watcom.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/openwatcom-v2
          curl -L -o /tmp/ow-snapshot.tar.xz \
            https://github.com/open-watcom/open-watcom-v2/releases/download/Last-CI-build/ow-snapshot.tar.xz
          tar -xJf /tmp/ow-snapshot.tar.xz -C ~/openwatcom-v2
          rm -f /tmp/ow-snapshot.tar.xz

      - name: Configure OpenWatcom env
        run: |
          # Generate the setvars.sh that build_dos.sh sources automatically.
          # The cache step skips its creation step so this also runs on
          # cache hits; -f overwrites without complaint.
          cat > ~/openwatcom-v2/setvars.sh <<'EOF'
          export WATCOM=$HOME/openwatcom-v2
          export PATH=$WATCOM/binl64:$WATCOM/binl:$PATH
          export EDPATH=$WATCOM/eddat
          export INCLUDE=$WATCOM/h
          EOF
          chmod +x ~/openwatcom-v2/setvars.sh
          # Also export to subsequent steps directly so a missing
          # setvars.sh on a future runner doesn't silently break the build.
          {
            echo "WATCOM=$HOME/openwatcom-v2"
            echo "EDPATH=$HOME/openwatcom-v2/eddat"
            echo "INCLUDE=$HOME/openwatcom-v2/h"
          } >> "$GITHUB_ENV"
          echo "$HOME/openwatcom-v2/binl64" >> "$GITHUB_PATH"
          echo "$HOME/openwatcom-v2/binl"   >> "$GITHUB_PATH"

      - name: Build 16-bit DOS target
        run: |
          ./build_dos.sh 16
          mkdir -p .ci-stash
          cp gwbasic16.exe .ci-stash/

      - name: Build 32-bit DOS target
        run: |
          ./build_dos.sh clean
          ./build_dos.sh 32
          cp gwbasic.exe .ci-stash/

      - name: Verify binary sizes look sane
        run: |
          size16=$(stat -c%s .ci-stash/gwbasic16.exe)
          size32=$(stat -c%s .ci-stash/gwbasic.exe)
          echo "gwbasic16.exe = $size16 bytes"
          echo "gwbasic.exe   = $size32 bytes"
          [ "$size16" -gt 80000 ]  && [ "$size16" -lt 200000 ]
          [ "$size32" -gt 100000 ] && [ "$size32" -lt 500000 ]

      - name: Install DOS runtime test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 mtools

      - name: Cache pinned FreeDOS distribution
        uses: actions/cache@v4
        with:
          path: ~/.cache/gwbasic-freedos
          key: freedos-1.4-floppy-45b1fa7c52dd996c

      - name: Run DOS16 and DOS32 under FreeDOS
        run: |
          python3 tests/run_dos_runtime.py \
            --dos16 .ci-stash/gwbasic16.exe --dos32 .ci-stash/gwbasic.exe \
            --dos4gw "$WATCOM/binw/dos4gw.exe" --output build/dos-runtime

      - name: Upload DOS runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dos-runtime-evidence
          path: build/dos-runtime/
          if-no-files-found: warn

      - name: Upload DOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dos-binaries
          path: .ci-stash/*.exe
          include-hidden-files: true
          if-no-files-found: error

  release-archives:
    needs: [build-and-test, dos-cross-compile]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install release build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libpulse-dev zip
      - name: Build Linux binaries
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
      - uses: actions/download-artifact@v4
        with:
          name: dos-binaries
          path: build/dos
      - name: Package and smoke-test archives
        run: |
          python3 pkg/build_release.py --dos16 build/dos/gwbasic16.exe \
            --dos32 build/dos/gwbasic.exe --output dist/release
          cd dist/release
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-archives
          path: dist/release/*
          if-no-files-found: error
