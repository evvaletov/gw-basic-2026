name: Docs

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r docs/requirements.txt

      - name: Build documentation with warnings as errors
        run: python -m sphinx -W --keep-going -n -b html docs docs/_build/html

      - name: Install example build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libpulse-dev gfortran

      - name: Build runtime for documented commands
        run: |
          cmake -S . -B build
          cmake --build build -j2

      - name: Check documentation test failure detection
        run: python tests/test_doc_examples.py

      - name: Run documented interpreter, compiler and FFI examples
        run: python tests/run_doc_examples.py --report docs/_build/examples.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-example-results
          path: docs/_build/examples.json
          if-no-files-found: warn

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: docs/_build/html

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
