name: Package installation

on:
  push:
    branches: [main, 'packaging/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  homebrew:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: Homebrew/actions/setup-homebrew@ceec4e8419bb3c97ce96e9dda7738499ed5f869d
      - name: Install and test the formula
        run: |
          brew tap evvaletov/gwbasic "$GITHUB_WORKSPACE"
          brew install --build-from-source evvaletov/gwbasic/gwbasic
          brew test evvaletov/gwbasic/gwbasic
          brew style evvaletov/gwbasic/gwbasic

  kernel:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.13'
          - os: macos-15
            python: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Build native interpreter and Python distributions
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPKG_CONFIG_EXECUTABLE=/usr/bin/false
          cmake --build build --parallel 2
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Test a clean wheel installation
        run: |
          python -m venv "$RUNNER_TEMP/kernel-venv"
          "$RUNNER_TEMP/kernel-venv/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/kernel-venv/bin/python" "$GITHUB_WORKSPACE/tests/test_kernel_package.py" --binary "$GITHUB_WORKSPACE/build/gwbasic"
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-dist-${{ matrix.os }}-py${{ matrix.python }}
          path: dist/*
          if-no-files-found: error
